    <script>
      // تُفعَّل حركة الظهور فقط إن لم يطلب المستخدم تقليل الحركة. إن لم يكتمل تحميل
      // السكربت الرئيسي خلال ثوانٍ، تُلغى الحالة المخفية ليبقى المحتوى ظاهرًا دائمًا.
      (function () {
        var d = document.documentElement;
        try {
          if ('IntersectionObserver' in window && matchMedia('(prefers-reduced-motion: no-preference)').matches) {
            d.classList.add('motion');
            setTimeout(function () { if (!window.__bidayahReady) d.classList.remove('motion'); }, 3500);
          }
        } catch (e) {}
      })();
    </script>
